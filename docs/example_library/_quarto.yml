# Quarto project for the aggregate Example Library.
# Standalone website (blog-style listing of executable example posts).
# Render with the project env so the jupyter kernel has aggregate installed:
#     uv run quarto render            (needs: uv sync --extra notebook)
#     uv run quarto preview           (live reload while authoring)

project:
  type: website
  output-dir: _site
  # Execute every post from the project root so `uw.load('example_library.agg')`
  # resolves the shared knowledge base regardless of which post is rendering.
  execute-dir: project

website:
  title: "aggregate Example Library"
  description: >
    Small, focused, executable examples — cookbook entries and published-paper
    reproductions, all computed live with aggregate.
  navbar:
    left:
      - href: index.qmd
        text: Examples
    right:
      - icon: github
        href: https://github.com/mynl/aggregate
  page-footer:
    center: "Built with aggregate · Stephen J. Mildenhall"

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 2
    code-fold: false
    code-tools: true

# Jupyter engine; the kernel must be the project env (aggregate installed).
jupyter: python3

execute:
  freeze: auto      # don't re-run a post unless its source changed; commit _freeze/
  warning: false

# Bibliography for paper-sourced examples. These point at the author's master
# library (the project standing order); swap for project-local copies if you
# add them here.
bibliography: C:/s/TELOS/Biblio/uber-library.bib
csl: C:/s/TELOS/Biblio/journal-of-risk-and-uncertainty.csl

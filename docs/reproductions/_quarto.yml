project:
  type: book
  output-dir: _book

book:
  title: "Reproductions"
  subtitle: "Published actuarial and numerical results, rebuilt with aggregate"
  author: "Stephen J. Mildenhall"
  date: today
  search: true
  chapters:
    - index.qmd
    - part: "Actuarial models"
      chapters:
        - Venter1983.qmd
        - Mack2003.qmd
        - Mata2005.qmd
        - Bodoff2017.qmd
        - Homer2003.qmd
        - Bear1990.qmd
        - Homer2003.qmd
    - part: "Exact computation and convolution accuracy"
      chapters:
        - Bruno2006.qmd
        - Wilson2016a.qmd
        - Wilson2017.qmd
    - part: "Rare events and the far tail"
      chapters:
        - Asmussen2016a.qmd
        - BenAmar2023.qmd
        - BenRached2024.qmd
        - Liu2026.qmd
        - Commentary.qmd
    - part: "Papers that did not reproduce"
      chapters:
        - Jin2016.qmd
    - part: "Reference"
      chapters:
        - severity-curves.qmd
    - references.qmd

bibliography: C:/s/TELOS/Biblio/uber-library.bib
csl: C:/s/TELOS/Biblio/journal-of-risk-and-uncertainty.csl

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-fold: false
    code-overflow: wrap
    citations-hover: true
    footnotes-hover: true

  pdf:
    documentclass: scrreprt
    papersize: letter
    pdf-engine: tectonic
    # Tectonic names the stream it reads on stdin `texput.tex`, and without
    # --print it reports "halted on potentially-recoverable error" and swallows
    # the message that says what the error actually was. --print puts the TeX
    # engine's own output through, which is the only way to see it.
    # -Z continue-on-errors reports every LaTeX error in one pass instead of
    # stopping at the first; without it, finding n errors costs n full renders.
    pdf-engine-opts:
      - --print
      - -Zcontinue-on-errors
    toc: true
    toc-depth: 2
    number-sections: true
    colorlinks: true
    code-overflow: wrap
    # greater_tables emits html and plain text, never latex, so pdf falls back
    # to the plain text rendering, which draws its rules with box characters
    # (U+2500 to U+2502). Latin Modern Mono has none of them. Consolas does.
    monofont: Consolas
    geometry:
      - margin=1in
    include-in-header:
      text: |
        %==============================
        % tikz and related
        %==============================
        \usepackage{amsmath}
        \usepackage{amssymb}         % If needed
        \usepackage{multirow}
        \usepackage{url}
        \usepackage{tikz}
        \usepackage{color}

        \usetikzlibrary{arrows,calc,positioning,shadows.blur,decorations.pathreplacing}
        \usetikzlibrary{automata}
        \usetikzlibrary{fit}
        \usetikzlibrary{snakes}
        \usetikzlibrary{intersections}
        \usetikzlibrary{decorations.markings,decorations.text, decorations.pathmorphing,decorations.shapes}
        \usetikzlibrary{decorations.fractals,decorations.footprints}
        \usetikzlibrary{graphs}
        \usetikzlibrary{matrix}
        \usetikzlibrary{shapes.geometric}
        \usetikzlibrary{mindmap, shadows}
        \usetikzlibrary{backgrounds}
        \usetikzlibrary{cd}

        \newcommand{\grtspacer}{\vphantom{lp}}
        \newcommand{\I}{\vphantom{lp}}
        \newcommand{\set}[1]{\left\{\,#1\,\right\}}

# Executed cells are frozen, so a re-render only re-runs what changed. Delete
# _freeze/ to force a full recompute.
execute:
  freeze: auto
  daemon: 1800    # keep kernel alive for 1800 secs
  error: true

jupyter: python3
[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aggregate"
version = "1.0.0a214"
description = "Tools for creating and working with aggregate probability distributions."
readme = "README.md"
authors = [
    {name = "Stephen J. Mildenhall", email = "steve@convexrisk.com"},
]
maintainers = [
    {name = "Stephen J. Mildenhall", email = "steve@convexrisk.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "IPython",
    "lark>=1.1",
    "matplotlib>=3.5",
    "numpy>=1.26",
    "pandas>=2.1",
    "Pygments",
    "scipy>=1.11",
    # made optional in 0.27
    # "numba",
]
license = "BSD-3-Clause"
requires-python = ">=3.11"

[project.urls]
Documentation = "https://aggregate.readthedocs.io/en/latest/"
"Source Code" = "https://github.com/mynl/aggregate"

[project.optional-dependencies]
dev = [
    "myst-parser>=2.0",
    "sphinx>=8.1,<9",
    "docutils>=0.20,<0.22",
    "nbsphinx>=0.9.4",
    "jupyter-sphinx>=0.5.3",
    "sphinx-copybutton>=0.5",
    "sphinx-toggleprompt>=0.6",
    "pickleshare",
    # "recommonmark>=0.7.1",
    # "setuptools>=62.3.2",
    # "sphinx-panels",
    # "sphinx-rtd-dark-mode",
    "sphinx_rtd_theme>=2.0",
    "sphinxcontrib-bibtex",
    "sphinx-multitoc-numbering",
    "pytest>=7",
    "pytest-xdist>=3",
    # Test-impact analysis for the edit loop: reruns only the tests your change
    # actually touched. NB it traces coverage in-process, so it does NOT work
    # under xdist -- use `pytest -n0 --testmon`. See CLAUDE.md.
    "pytest-testmon>=2",
    "pyarrow>=15",
    "ruff>=0.6",
]
notebook = [
    "jupyterlab",
    "ipywidgets",
    "jupytext",
    "attrs",
    "ipython-autotime",
    # "greater_tables",
]
# Opt-in accelerator: numba-compiled TVaR / biTVaR inner loops in utilities.py.
# Pure-numpy fallbacks exist, so this is not required (numba was dropped as a
# hard dependency in 0.27). Declared here so it is an installable extra
# (`pip install aggregate[numba]` / `uv sync --extra numba`) rather than an
# undeclared package that a bare `uv sync` treats as removable.
numba = [
    "numba",
]
# disk-backed (out-of-core) bivariate update -- dev/plan-bv.md. zarr 3 needs
# py >= 3.11, matching requires-python.
massive = [
    "zarr>=3",
]
# Tier-2 interactive explorer for the massive bivariate (plan-bv §7.3).
viz = [
    "datashader",
    "holoviews",
    "bokeh",
]
# Business exhibits to greater_tables table-document IR (dev/plan-exhibits.md,
# [Exhibits-Module]). greater_tables 6 is NOT yet on PyPI (latest published is
# 5.3.0), so the extra stays commented until it publishes: an active extra
# would make `uv sync --all-extras` unresolvable. Until then install the
# sibling checkout ad hoc, as aggregate_api does:
#   UV_PROJECT_ENVIRONMENT=.venv uv pip install -e C:/S/AI/greatest-tables
# Activate when GT 6 publishes:
# exhibits = [
#     "greater_tables>=6.0.0a8",
# ]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}
packages = ["aggregate"]

[tool.setuptools.package-data]
aggregate = ["*.lark", "agg/*.agg", "data/*.mplstyle", "data/*.toml"]

[tool.ruff]
# Linting only for now -- no whole-repo reformat (that would be a huge diff and
# collide with the in-flight numerics refactor). Run `uv run ruff check src`.
line-length = 100

[tool.ruff.lint]
# Start conservative: just pyflakes (unused imports/vars, bad f-strings, etc.).
# Deliberately NOT enabling pycodestyle E so the long-lined codebase doesn't
# drown in E501. Widen this set later if desired.
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# The package __init__ intentionally re-exports submodule surfaces via `import *`.
"__init__.py" = ["F401", "F403"]
# distributions.py is a thin public facade over the underscore-prefixed kind
# modules (_fits / _frequency / _severity / _aggregate); it re-exports their
# surfaces via `import *`, so the star-import findings are expected, not bugs.
"distributions.py" = ["F401", "F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n auto fans the suite across all cores (pytest-xdist); the workload is
# FFT/numpy-bound and parallelizes cleanly. Disable with `-n0` when you need a
# breakpoint/pdb or deterministic single-process ordering.
# -m 'not slow' is the fast-by-default local loop: the bleeding-edge bivariate
# suites (the multi-minute cases) are quarantined. Run EVERYTHING (gate/CI) with
#   uv run pytest -m 'slow or not slow'
# --dist loadgroup keeps ungrouped tests distributed as before, but sends every
# test sharing an `xdist_group` name to ONE worker, so they run sequentially
# against each other. Used by the memory-heavy bivariate cases: several 2-D FFT
# grids allocated concurrently across workers could exhaust memory, which
# surfaced once as a numpy allocation failure in a test whose own grid is 64x64.
addopts = "-ra --strict-markers -n auto --dist loadgroup -m 'not slow'"
markers = [
    "slow: bleeding-edge / multi-minute cases (bivariate, massive bivariate, reins bivariate). Deselected by default via addopts; run the full suite with `-m 'slow or not slow'`.",
    "xdist_group: pin a set of tests to one xdist worker so they do not run concurrently with each other (memory-heavy 2-D FFT cases).",
]

#[tool.setuptools.packages.find]
#where = ["."]
#exclude = ["templates*", "agg*"]

[project.entry-points."pygments.lexers"]
lexer = "aggregate.decl_pygments:AggLexer"

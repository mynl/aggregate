[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aggregate"
version = "1.0.0a98"
description = "Tools for creating and working with aggregate probability distributions."
readme = "README.md"
authors = [
    {name = "Stephen J. Mildenhall", email = "steve@convexrisk.com"},
]
maintainers = [
    {name = "Stephen J. Mildenhall", email = "steve@convexrisk.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "IPython",
    "lark>=1.1",
    "matplotlib>=3.5",
    "numpy>=1.26",
    "pandas>=2.1",
    "Pygments",
    "scipy>=1.11",
    # made optional in 0.27
    # "numba",
]
license = "BSD-3-Clause"
requires-python = ">=3.11"

[project.urls]
Documentation = "https://aggregate.readthedocs.io/en/latest/"
"Source Code" = "https://github.com/mynl/aggregate"

[project.optional-dependencies]
dev = [
    "myst-parser>=2.0",
    "sphinx>=8.1,<9",
    "docutils>=0.20,<0.22",
    "nbsphinx>=0.9.4",
    "jupyter-sphinx>=0.5.3",
    "sphinx-copybutton>=0.5",
    "sphinx-toggleprompt>=0.6",
    "pickleshare",
    # "recommonmark>=0.7.1",
    # "setuptools>=62.3.2",
    # "sphinx-panels",
    # "sphinx-rtd-dark-mode",
    "sphinx_rtd_theme>=2.0",
    "sphinxcontrib-bibtex",
    "sphinx-multitoc-numbering",
    "pytest>=7",
    "pyarrow>=15",
    "ruff>=0.6",
]
notebook = [
    "jupyterlab",
    "ipywidgets",
    "jupytext",
    "attrs",
    "ipython-autotime",
    # "greater_tables",
]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}
packages = ["aggregate"]

[tool.setuptools.package-data]
aggregate = ["*.lark", "agg/*.agg", "data/*.mplstyle", "data/*.toml"]

[tool.ruff]
# Linting only for now -- no whole-repo reformat (that would be a huge diff and
# collide with the in-flight numerics refactor). Run `uv run ruff check src`.
line-length = 100

[tool.ruff.lint]
# Start conservative: just pyflakes (unused imports/vars, bad f-strings, etc.).
# Deliberately NOT enabling pycodestyle E so the long-lined codebase doesn't
# drown in E501. Widen this set later if desired.
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# The package __init__ intentionally re-exports submodule surfaces via `import *`.
"__init__.py" = ["F401", "F403"]
# distributions.py is a thin public facade over the underscore-prefixed kind
# modules (_fits / _frequency / _severity / _aggregate); it re-exports their
# surfaces via `import *`, so the star-import findings are expected, not bugs.
"distributions.py" = ["F401", "F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

#[tool.setuptools.packages.find]
#where = ["."]
#exclude = ["templates*", "agg*"]

[project.entry-points."pygments.lexers"]
lexer = "aggregate.decl_pygments:AggLexer"


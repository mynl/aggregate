# aggregate configuration -- annotated template
# =============================================================================
# Copy this file to  ~/.aggregate/config.toml  (e.g. via
# `aggregate.config.write_default_config()` or
# `build.write_default_config()`), then UNCOMMENT and edit the lines you want
# to change. Every line below is commented out, so a freshly written file is
# inert: it produces exactly the built-in defaults until you uncomment a key.
#
# Precedence (low -> high): built-in defaults  <  this file  <  AGGREGATE_*
# environment variables  <  explicit build(...) / Underwriter(...) keywords.
#
# The file is read ONCE per session (on first use). After editing it in a live
# session, call  aggregate.config.reload_settings()  (or restart). The shown
# values are the defaults.
# =============================================================================


# [build] -- defaults for Underwriter() and the module-level `build`.
[build]
# log2: log2 of the number of grid buckets (2**log2 buckets). Larger = finer
# and more accurate but more memory/time (memory ~ 2**log2). Typical 10..20.
# log2 = 16

# bs: bucket size. 0 = let the object recommend one (recommended). Otherwise a
# positive float (a power of two, or 1/64 etc.) pins the grid.
# bs = 0

# padding: FFT zero-padding (extra powers of two of space) used in update.
# padding = 1

# normalize: renormalise the discretized severity in update. true | false.
# normalize = true

# databases: knowledge base(s) loaded on construction. A list of names.
#   "examples"             -- the curated v1.0 example library (shipped default)
#   "_test_suite"          -- bundled regression suite (temporary; retired pre-beta)
#   "default"              -- every bundled *.agg file
#   "user"                 -- your *.agg files in ~/.aggregate
#   "all"                  -- bundled + user
#   "my_book"              -- a single named file (CWD, then ~/.aggregate, then bundled)
# databases = ["examples"]

# update: auto-update constructed objects. true | false.
# update = true


# [discretization] -- how distributions are placed on the FFT grid.
[discretization]
# reins_bucket: rebucketing scheme for reinsurance net/ceded distributions.
#   "linear"  -- split off-grid mass across the two bracketing buckets
#                (preserves the first moment exactly) [recommended]
#   "nearest" -- round to the closest bucket (<= bs/2 positional bias)
# reins_bucket = "linear"

# dsev_bucket: placement scheme for discrete-severity atoms (dsev / dhistogram
# / fixed). Same options as reins_bucket.
# dsev_bucket = "linear"

# bucket_sizing_p: percentile of the fitted distribution used to size bs in
# recommend_bucket. Values > 1 are read as a number of nines (p -> 1 - 10**-p),
# so e.g. 6 means 0.999999. Raise toward 1 for thick-tailed distributions.
# bucket_sizing_p = 0.99999

# window_nines: nines defining the automatic 1-D aggregate output window
# (spans ~ 10**-n .. 1 - 10**-n quantiles). Higher = wider window. Typical 8..14.
# This is the PROTECTED edge -- the tail the sign convention prices (the right
# for a loss, the left for a payoff) -- sized deep to avoid clipping.
# window_nines = 12

# window_nines_trim: nines for the UNPROTECTED (cheap) edge of a windowed
# two-sided aggregate -- the left for a loss, the right for a payoff. Shallower
# than window_nines so the window trims dead space on that side rather than
# wasting grid. Only affects a windowed book (mass band clears 0).
# window_nines_trim = 6

# window_pad_skew: padding-balance skew Delta in [0, 0.5). Once a windowed band
# is placed, the power-of-2 slack is split f = 0.5 -/+ Delta below the band
# (0.5 - Delta for a loss -> more room on the priced right; 0.5 + Delta for a
# payoff). 0 centres the band exactly.
# window_pad_skew = 0.1

# sbj_tail_floor: numerical-depth floor for the single-big-jump extent floor.
# A subexponential / signed severity can carry a far tail the 3-moment window
# misses (P(S>x) ~ E[N] P(X>x)); the grid extent is floored by one big claim on
# a typical bulk, probing the severity at p** = 1 - (1 - p*)/E[N]. For a large
# E[N], 1 - p** underflows double precision, so it is floored here (default
# 1e-14, ~ window_nines + 2 nines).
# sbj_tail_floor = 1e-14


# [validation] -- moment-matching tolerances.
[validation]
# eps: relative-error threshold above which a moment mismatch is flagged.
# eps = 1e-4

# noise: absolute dust floor; quantities below this are treated as exact zero.
# This is a numerical floor, NOT a coverage target. aggregate's FFT arithmetic
# is essentially exact, so keep this tight: sensible band 1e-12 .. 1e-14.
# noise = 1e-12


# [bivariate] -- defaults for the bivariate module.
[bivariate]
# window_nines: nines for the per-axis 2-D sizing window -- the equal-tail
# probability budget 10**-window_nines that balanced_window trims off each tail
# when the bv measures each realized marginal. Kept a few nines shallower than
# [discretization].window_nines (9 vs 12): the realized marginal's far tail is
# FFT numerical dust below ~1e-10, so measuring deeper reads noise (and biases a
# symmetric axis). 9 stays above the floor; per-axis deficit ~1e-9. Typical 8..10.
# window_nines = 9
# total_log2: total 2-D grid budget in log2 cells (2**total_log2 cells, split
# between axes by measured support). The square-law memory lever. Typical 18..22.
# total_log2 = 20


# [labels] -- display / semantic-convention labels for value_type.
[labels]
# The two value_type sign-convention labels: loss ("more is worse", the
# default) and payoff ("more is better"; set by pnl). These are display and
# spelling settings only: changing one renames that value everywhere it
# appears (info blocks, stats_df, the value_type setter's accepted inputs).
# The underlying role of existing objects never changes with a relabel.
# loss = "loss"
# payoff = "payoff"
